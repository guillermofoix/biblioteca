name: CI

on:
  pull_request:            # en cada PR: ¿se puede fusionar?
  push:
    branches: [main]       # en cada cambio de main: ¿sigue funcionando?

permissions:
  contents: read           # solo necesita leer el código

jobs:
  tests:
    runs-on: ubuntu-latest           # una máquina que presta GitHub
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Revisar el estilo con ruff
        run: ruff check .

      - name: Ejecutar los tests con pytest
        run: pytest -v

  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:                      # un PostgreSQL de usar y tirar, solo para este job
        image: postgres:16           # mejor la misma versión mayor que tu RDS
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca   # no es un secreto: esta base de datos desaparece al acabar el job
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar los tests con la base de datos real
        run: pytest -v tests/test_integracion.py

  build:
    needs: [tests, integracion]      # solo si los dos han pasado
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Construir la imagen Docker
        run: docker build -t biblioteca:${{ github.sha }} .

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: biblioteca:${{ github.sha }}
          severity: CRITICAL,HIGH    # solo los fallos graves
          ignore-unfixed: true       # no los que aún no tienen arreglo
          exit-code: "1"             # si encuentra alguno, el job falla
          format: table
          trivyignores: .trivyignore
