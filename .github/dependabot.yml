version: 2
updates:
  - package-ecosystem: pip           # requirements.txt y requirements-dev.txt
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:             # las versiones pequeñas, en un solo PR
        update-types: [minor, patch]

  - package-ecosystem: docker        # la imagen base del Dockerfile
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Cambiar de versión de Python se planifica aparte (Dockerfile, ci.yml y pyproject.toml a la vez)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions   # las acciones de los workflows
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
